schema_version = "1.4"

[task]
name = "storygold/freecad-0004-sling-lift"
version = "1.0.0"
description = "Reconstruct a parametric CAD from a technical drawing"
keywords = ["freecad", "cad", "geometric_reconstruction"]

[[task.authors]]
name = "StoryGold"

[metadata]
program = "FreeCAD"
category = "geometric_reconstruction"
units = "mm"
human_baseline_minutes = 480
max_score = 6

output_modality = "cad"
accepted_output_formats = ["fcstd", "freecad-py", "fcmacro"]
reference = ["solution/solution.FCStd"]
notes = "Deterministic FreeCAD 1.1 headless grader; no LLM. Six equally weighted checks: completeness, geometry/dimensions, mates, articulation/limits, dimensional-control coverage, and actual geometry response to parameter edits. A valid global mirror is accepted. The frozen reference is tests/task/reference/solution.FCStd. Two ISO 8752 6x16 pins from the drawing are allowed even though the reference omits them. See tests/task/harness/NOTES.md for measurements, tolerances, validation and supported modeling scope."

[metadata.harness]
entrypoint = "harness/harness.py"
timeout_s = 600.0
requires_solidworks = false
requires_freecad = true
requires_llm = false

[[metadata.inputs]]
path = "environment/input.pdf"
format = "pdf"
role = "primary"

